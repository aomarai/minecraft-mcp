name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole pipeline first, with the version of the tag.
  workflow_call:
    inputs:
      release-version:
        description: Version to build the jars as (empty for a snapshot)
        type: string
        default: ""

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_releaseVersion: ${{ inputs.release-version }}

# The jobs run in parallel on separate runners, so the slow part (preparing Minecraft for each NeoForge
# node) never competes for memory with the rest. Each loader's smoke tests start as soon as its own jars
# exist, without waiting for the other loader.
jobs:
  # The three jobs that need no Minecraft (core, mutation, universal) pass --configure-on-demand: without it Gradle
  # configures every Fabric and NeoForge node too, and Loom downloads and prepares the game for each, about 110 s of
  # the 412 s a Pitest job took (docs/ci.md).
  # The loader-agnostic code: unit tests and the 100% coverage gate.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release hygiene (MIT license, no jars or world data committed)
        run: scripts/release/check-repo.sh
      - uses: ./.github/actions/setup-build
      - run: ./gradlew :core:build :stdio-shim:build :adapters:rcon:build --configure-on-demand --no-daemon --refresh-dependencies

  # The mutation score (100% for each module). Pitest is by far the slowest step (core 5 min, rcon 4 min, stdio-shim
  # 1 min, measured on the runner) and uses every CPU of a runner, so each module gets its own runner instead of
  # queueing behind the others; the whole pipeline then takes as long as the slowest module, not the sum.
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [":core", ":stdio-shim", ":adapters:rcon"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - run: ./gradlew ${{ matrix.module }}:pitest --configure-on-demand --no-daemon

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      # Every Fabric version node (see docs/version-matrix.md).
      # Then the Fabric game tests: a real server with fake players joining, chatting, dying and leaving. One Gradle
      # invocation, so the daemon starts and configures the build once.
      - run: ./gradlew :adapters:fabric:1.21.1:build :adapters:fabric:26.2:build :adapters:fabric:26.3:build :adapters:fabric:1.21.1:runGameTest --no-daemon --refresh-dependencies
      - name: Collect the mod jars
        run: |
          mkdir jars
          cp adapters/fabric/versions/*/build/libs/minecraft-mcp-*.jar jars/
          ls -l jars
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars-fabric
          path: jars/
          retention-days: 1

  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      # Every NeoForge version node. They prepare Minecraft one at a time (the neoformRuntime build service).
      - run: ./gradlew :adapters:neoforge:1.21.1:build :adapters:neoforge:26.2:build :adapters:neoforge:26.3:build --no-daemon --refresh-dependencies
      - name: Collect the mod jars
        run: |
          mkdir jars
          cp adapters/neoforge/versions/*/build/libs/minecraft-mcp-*.jar jars/
          ls -l jars
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars-neoforge
          path: jars/
          retention-days: 1

  # The standalone jars: the universal tier for servers without a mod, and the stdio shim for hosts that can only
  # launch stdio servers. Their tests run in the core job; this builds the jars and checks they work as jars.
  universal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - run: ./gradlew :adapters:rcon:shadowJar :stdio-shim:shadowJar --configure-on-demand --no-daemon --refresh-dependencies
      - name: The shim jar talks to the universal jar over stdio
        run: bash scripts/smoke/shim-smoke.sh adapters/rcon/build/libs/minecraft-mcp-*-universal.jar stdio-shim/build/libs/minecraft-mcp-*-stdio-shim.jar
      - name: Collect the jars
        run: |
          mkdir jars
          cp adapters/rcon/build/libs/minecraft-mcp-*-universal.jar stdio-shim/build/libs/minecraft-mcp-*-stdio-shim.jar jars/
          ls -l jars
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jars-universal
          path: jars/
          retention-days: 1

  # A jar that compiles is not a jar that loads: start a real server with each one, in parallel.
  smoke-universal:
    needs: universal
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [vanilla, paper, fabric-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars-universal
          path: jars
      - run: bash scripts/smoke/run-in-docker.sh ${{ matrix.server }} jars/minecraft-mcp-*-universal.jar

  smoke-fabric:
    needs: fabric
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars-fabric
          path: jars
      - run: bash scripts/smoke/run-in-docker.sh fabric jars/minecraft-mcp-*+${{ matrix.node }}-fabric.jar adapters/fabric/versions/${{ matrix.node }}/gradle.properties

  smoke-neoforge:
    needs: neoforge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jars-neoforge
          path: jars
      - run: bash scripts/smoke/run-in-docker.sh neoforge jars/minecraft-mcp-*+${{ matrix.node }}-neoforge.jar adapters/neoforge/versions/${{ matrix.node }}/gradle.properties

  # A real game client on a virtual display (software OpenGL; software Vulkan for 26.3): the client-only tools, a
  # world made with them, and the local player moving, digging and placing, checked against the integrated server's
  # own endpoint. It builds the node itself (Gradle's runClient), so it does not wait for the jars.
  smoke-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-build
      - name: Virtual display and software OpenGL (and Vulkan for 26.3, which has no OpenGL window under Xvfb)
        env:
          # Only 26.3 needs the (large) software Vulkan driver.
          VULKAN: ${{ matrix.node == '26.3' && 'mesa-vulkan-drivers libvulkan1' || '' }}
        run: |
          # A mirror that trickles one package once held a run for 8 minutes and then again for 9, past any
          # inactivity timeout. Bound each attempt as a whole and retry; apt resumes a partial download.
          # The runner's default mirror (azure.archive.ubuntu.com) was slow for every package and stalled on the 19 MB
          # Vulkan driver, while archive.ubuntu.com answered at once: use that.
          echo "https://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update -o Acquire::Retries=3
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get install -o Acquire::Retries=3 -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0 libegl1 libopenal1 libxrandr2 libxxf86vm1 libxcursor1 libxi6 libxinerama1 libxext6 libxrender1 libxtst6 $VULKAN && exit 0
            echo "apt attempt $attempt did not finish; retrying"
          done
          exit 1
      - run: bash scripts/smoke/client-smoke.sh ${{ matrix.node }}

  # The repository ruleset requires a check named build-and-test. This job keeps that name and passes only
  # when every job above passed, so a failing or skipped job still blocks the merge.
  build-and-test:
    if: always()
    needs: [core, mutation, fabric, neoforge, universal, smoke-fabric, smoke-neoforge, smoke-universal, smoke-client]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      # How long every job took, on the run page, and a warning when the run is over its budget. It reads the API and
      # must never decide the result, so a failure here is ignored.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Job durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/duration-summary.py "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Everything passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
