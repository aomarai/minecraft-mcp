name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Dependency verification compares downloaded artifacts against the
          # committed metadata. A restored cache from the base branch can contain
          # artifacts resolved before the metadata changed, which then fail
          # verification. Disable caching so every run verifies fresh downloads.
          cache-disabled: true
      - run: ./gradlew build --no-daemon --refresh-dependencies
