name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this whole pipeline first, with the version of the tag.
  workflow_call:
    inputs:
      release-version:
        description: Version to build the jars as (empty for a snapshot)
        type: string
        default: ""

permissions:
  contents: read

env:
  ORG_GRADLE_PROJECT_releaseVersion: ${{ inputs.release-version }}

# The jobs run in parallel on separate runners, so the slow part (preparing Minecraft for each NeoForge
# node) never competes for memory with the rest. Each loader's smoke tests start as soon as its own jars
# exist, without waiting for the other loader.
jobs:
  # The loader-agnostic code: unit tests, the 100% coverage gate and the mutation score.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - run: ./gradlew :core:build :stdio-shim:build :adapters:rcon:build --no-daemon --refresh-dependencies
      - run: ./gradlew :core:pitest :stdio-shim:pitest :adapters:rcon:pitest --no-daemon

  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      # Every Fabric version node (see docs/version-matrix.md).
      - run: ./gradlew :adapters:fabric:1.21.1:build :adapters:fabric:26.2:build :adapters:fabric:26.3:build --no-daemon --refresh-dependencies
      # Fabric game tests: a real server with fake players joining, chatting, dying and leaving.
      - run: ./gradlew :adapters:fabric:1.21.1:runGameTest --no-daemon
      - name: Collect the mod jars
        run: |
          mkdir jars
          cp adapters/fabric/versions/*/build/libs/minecraft-mcp-*.jar jars/
          ls -l jars
      - uses: actions/upload-artifact@v7
        with:
          name: jars-fabric
          path: jars/
          retention-days: 1

  neoforge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      # Every NeoForge version node. They prepare Minecraft one at a time (the neoformRuntime build service).
      - run: ./gradlew :adapters:neoforge:1.21.1:build :adapters:neoforge:26.2:build :adapters:neoforge:26.3:build --no-daemon --refresh-dependencies
      - name: Collect the mod jars
        run: |
          mkdir jars
          cp adapters/neoforge/versions/*/build/libs/minecraft-mcp-*.jar jars/
          ls -l jars
      - uses: actions/upload-artifact@v7
        with:
          name: jars-neoforge
          path: jars/
          retention-days: 1

  # A jar that compiles is not a jar that loads: start a real server with each one, in parallel.
  smoke-fabric:
    needs: fabric
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jars-fabric
          path: jars
      - run: bash scripts/smoke/run-in-docker.sh fabric jars/minecraft-mcp-*+${{ matrix.node }}-fabric.jar adapters/fabric/versions/${{ matrix.node }}/gradle.properties

  smoke-neoforge:
    needs: neoforge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["1.21.1", "26.2", "26.3"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: jars-neoforge
          path: jars
      - run: bash scripts/smoke/run-in-docker.sh neoforge jars/minecraft-mcp-*+${{ matrix.node }}-neoforge.jar adapters/neoforge/versions/${{ matrix.node }}/gradle.properties

  # The repository ruleset requires a check named build-and-test. This job keeps that name and passes only
  # when every job above passed, so a failing or skipped job still blocks the merge.
  build-and-test:
    if: always()
    needs: [core, fabric, neoforge, smoke-fabric, smoke-neoforge]
    runs-on: ubuntu-latest
    steps:
      - name: Everything passed
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
