name: Dependabot verification metadata

# Dependabot bumps a version in build.gradle.kts, but the committed
# gradle/verification-metadata.xml still lists the old artifact's checksum.
# Without this workflow every Dependabot PR fails `build-and-test` on
# dependency verification. It runs on the Dependabot branch push (not on
# pull_request) because Dependabot PRs get a read-only GITHUB_TOKEN.
#
# The refresh runs the bumped dependency's own code (its Gradle plugin at configuration time, its library code
# in tests) with dependency verification turned off, so that code is unreviewed and the job must assume it is
# hostile. Two jobs keep it away from any write token: `refresh` runs Gradle with a read-only token that is not
# even stored in the checkout and hands over the two metadata files as an artifact; `commit` holds the write
# token, runs no build code, refuses anything but those two files and pushes.
#
# If the push is rejected, the repository's workflow token is read-only for
# Dependabot events: store a fine-grained PAT with Contents: write as
# DEPENDABOT_PAT and pass it via `token:` on actions/checkout.

on:
  push:
    branches:
      - "dependabot/**"

permissions:
  contents: read

concurrency:
  group: dependabot-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Only Dependabot's own pushes. The metadata commit the second job pushes is authored by github-actions[bot],
    # so it does not re-trigger the workflow.
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - name: Check out the Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # No token in .git/config: the build below runs code nobody has reviewed yet.
          persist-credentials: false

      # JDK 21 and 25 (the 26.x nodes need 25) and Gradle without a cache: the same setup every build job uses.
      - name: Set up the build
        uses: ./.github/actions/setup-build

      - name: Regenerate dependency verification metadata
        # A clean Gradle home makes the resolve see every transitive POM and record its checksum. It builds what CI
        # builds (core, shim, universal tier and every loader node, which is where Loom, ModDevGradle, Fabric API
        # and NeoForge are resolved) and runs the Pitest and shadow tasks, so a bump that only an adapter or a
        # plugin resolves gets its checksum too. The same command is in AGENTS.md.
        run: |
          rm -rf "$RUNNER_TEMP/gradle-home"
          mkdir -p "$RUNNER_TEMP/gradle-home"
          # The setup action told Gradle where the JDKs are in ~/.gradle; this run uses a clean Gradle home.
          cp ~/.gradle/gradle.properties "$RUNNER_TEMP/gradle-home/gradle.properties"
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" \
            ./gradlew build :core:pitest :stdio-shim:pitest :adapters:rcon:pitest :adapters:rcon:shadowJar \
              :stdio-shim:shadowJar --write-verification-metadata sha256 --no-daemon

      - name: Collect the two metadata files
        run: |
          mkdir "$RUNNER_TEMP/metadata"
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/metadata/"
          if [ -f gradle/verification-keyring.keys ]; then cp gradle/verification-keyring.keys "$RUNNER_TEMP/metadata/"; fi

      - name: Hand them to the commit job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/metadata/
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: refresh
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      # A fresh checkout of the very commit the first job built. This job never runs Gradle or anything else the
      # branch brings; it only copies two files and pushes.
      - name: Check out the Dependabot branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download the metadata files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-metadata
          path: ${{ runner.temp }}/metadata

      - name: Refuse anything but the two metadata files
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/metadata"
          # Plain files with exactly these names: no other file, folder or link.
          if find . -mindepth 1 \( -type l -o -type d \) | grep -q .; then
            echo "The artifact holds a folder or a link; refusing." >&2
            exit 1
          fi
          for f in *; do
            case "$f" in
              verification-metadata.xml|verification-keyring.keys) ;;
              *) echo "The artifact holds an unexpected file ($f); refusing." >&2; exit 1 ;;
            esac
          done
          cd "$GITHUB_WORKSPACE"
          cp "$RUNNER_TEMP"/metadata/* gradle/
          # Whatever the files are, nothing else in the checkout may differ from the commit that was built.
          changed="$(git status --porcelain --untracked-files=all | sed 's/^...//')"
          for f in $changed; do
            case "$f" in
              gradle/verification-metadata.xml|gradle/verification-keyring.keys) ;;
              *) echo "Unexpected change to $f; refusing." >&2; exit 1 ;;
            esac
          done

      - name: Commit and push metadata changes
        env:
          REF: ${{ github.ref }}
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml gradle/verification-keyring.keys \
              && [ -z "$(git ls-files --others --exclude-standard gradle)" ]; then
            echo "No verification metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml gradle/verification-keyring.keys
          git commit -m "chore(deps): refresh dependency verification metadata"
          # Fails if the branch has moved on since the first job ran, which is what we want.
          git push origin "HEAD:$REF"
