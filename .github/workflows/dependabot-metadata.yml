name: Dependabot verification metadata

# Dependabot bumps a version in build.gradle.kts, but the committed
# gradle/verification-metadata.xml still lists the old artifact's checksum.
# Without this workflow every Dependabot PR fails `build-and-test` on
# dependency verification. It runs on the Dependabot branch push (not on
# pull_request) because Dependabot PRs get a read-only GITHUB_TOKEN.
#
# If the push is rejected, the repository's workflow token is read-only for
# Dependabot events: store a fine-grained PAT with Contents: write as
# DEPENDABOT_PAT and pass it via `token:` on actions/checkout.

on:
  push:
    branches:
      - "dependabot/**"

permissions:
  contents: write

concurrency:
  group: dependabot-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-metadata:
    runs-on: ubuntu-latest
    # Only Dependabot's own pushes. The metadata commit this job pushes is
    # authored by github-actions[bot], so it does not re-trigger the workflow.
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Check out the Dependabot branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The restored cache can hold artifacts resolved before the metadata
          # changed, which then fail verification. Resolve fresh.
          cache-disabled: true

      - name: Regenerate dependency verification metadata
        # A clean Gradle home makes the resolve see every transitive POM and
        # record its checksum. :core:test is the current dependency surface;
        # widen to `build` as adapters gain code.
        run: |
          rm -rf "$RUNNER_TEMP/gradle-home"
          GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home" \
            ./gradlew --write-verification-metadata sha256 :core:test --no-daemon

      - name: Commit and push metadata changes
        run: |
          if git diff --quiet -- gradle/verification-metadata.xml gradle/verification-keyring.keys; then
            echo "No verification metadata changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml gradle/verification-keyring.keys
          git commit -m "chore(deps): refresh dependency verification metadata"
          git push
