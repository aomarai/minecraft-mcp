name: release

# Builds and tests every version node, then attaches the jars and their SHA-256 checksums to a GitHub
# release. See docs/release.md.
#
#   push a tag v1.2.3            -> builds as 1.2.3 and publishes the GitHub release
#   push a tag v1.2.3-dryrun     -> builds as 1.2.3, publishes nothing (keeps the files as a workflow artifact)
#   run it by hand (Actions tab) -> always a dry run, with the version you type
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build the jars as, for example 0.1.0-test (this is always a dry run)
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dry-run: ${{ steps.plan.outputs.dry-run }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"; dry=true
          else
            version="${REF_NAME#v}"; dry=false
            case "$version" in *-dryrun) version="${version%-dryrun}"; dry=true ;; esac
          fi
          # The version ends up in file names and mod metadata: allow only what a version can contain.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "not a usable version: '$version'" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry-run=$dry" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (dry run: $dry)"

  # The whole pipeline: unit tests, coverage, mutation testing, game test and a smoke test of every jar.
  build:
    needs: plan
    # build.yml's final job reads the run's job durations (actions: read); a called workflow cannot ask for more than
    # its caller grants, and without this the whole release run fails to start.
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build.yml
    with:
      release-version: ${{ needs.plan.outputs.version }}

  package:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jars-*
          merge-multiple: true
          path: dist
      - name: Check that every node is there, and nothing else
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # One jar per loader and version node in the repository, and the universal jar: a missing one fails the release.
          expected=$( (for node in adapters/*/versions/*/; do
            loader=$(basename "$(dirname "$(dirname "$node")")"); mc=$(basename "$node")
            echo "minecraft-mcp-$VERSION+$mc-$loader.jar"
          done; echo "minecraft-mcp-$VERSION-universal.jar"; echo "minecraft-mcp-$VERSION-stdio-shim.jar") | sort)
          found=$(cd dist && ls minecraft-mcp-*.jar 2>/dev/null | sort)
          if [ "$expected" != "$found" ]; then
            echo "expected:"; echo "$expected"; echo "found:"; echo "$found"
            echo "the jars do not match the nodes in the repository" >&2; exit 1
          fi
          echo "$found"
      - name: Release hygiene, version metadata and no Minecraft code in the jars
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/release/check-repo.sh
          scripts/release/check-jars.sh dist "$VERSION"
      - name: Checksums
        run: cd dist && sha256sum minecraft-mcp-*.jar > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          retention-days: 7
      - name: Release notes (matrix and known limitations)
        run: scripts/release/notes.sh > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  publish:
    # A dry run stops at the artifact above. Only a real tag publishes.
    if: needs.plan.outputs.dry-run == 'false'
    needs: [plan, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes --notes-file notes/release-notes.md --verify-tag

  # Modrinth and CurseForge. Runs after the GitHub release exists, and only does something for the platforms whose
  # secrets and project id are set (see docs/release.md); with neither set it just says so.
  publish-mods:
    if: needs.plan.outputs.dry-run == 'false'
    needs: [plan, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Upload to Modrinth and CurseForge
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: python3 -I scripts/release/publish-mods.py dist "$VERSION" notes/release-notes.md
