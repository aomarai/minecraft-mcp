name: SonarQube

# Analysis runs on the self-hosted ARC runners in the homelab, because that is
# the only place that can reach the in-cluster SonarQube Service.
#
# Push to main only. This SonarQube is Community Build, which does not support
# pull-request analysis: passing sonar.pullrequest.* aborts the scan with
# "To use the property sonar.pullrequest.key and analyze pull requests,
# Developer Edition or above is required", so a PR trigger can only ever produce
# a red check here.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Selected by `runnerScaleSetName: minecraft-mcp-runners` in the homelab repo
    # (apps/arc-runners-minecraft-mcp/values.yaml).
    runs-on: minecraft-mcp-runners
    # ARC's Kubernetes container mode sets ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER=true,
    # so the job MUST declare a container. The actions-runner image brings git,
    # curl, sudo and apt; the step below adds gpg/dirmngr, and actions/setup-java
    # provides the JDK 21 toolchain the build and the Gradle Sonar plugin need.
    container:
      image: ghcr.io/actions/actions-runner:latest
    env:
      # In-cluster Service DNS. The sq.homelab.local name is LAN-only and signed
      # by the private homelab CA, so CI cannot resolve or trust it.
      SONAR_HOST_URL: http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history gives the scanner accurate new-code and blame data.
          fetch-depth: 0

      - name: Ensure scanner prerequisites (gpg, dirmngr)
        # The actions-runner image ships no JRE and no gpg/dirmngr. The Gradle
        # Sonar plugin resolves and runs the scanner, and gpg/dirmngr are needed
        # if the plugin verifies downloaded artifacts. default-jre-headless is
        # OpenJDK 21 on Ubuntu 24.04; setup-java below provides the build JDK.
        run: |
          if ! command -v java >/dev/null 2>&1 \
             || ! command -v gpg >/dev/null 2>&1 \
             || ! command -v dirmngr >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              gpg dirmngr default-jre-headless
          fi
          java -version

      - name: Set up JDK 21 and 25
        # 21 runs Gradle and builds the 1.21.x nodes; the 26.x nodes need a Java 25 toolchain.
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Let Gradle find both JDKs
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64,JAVA_HOME_21_ARM64,JAVA_HOME_25_ARM64" >> ~/.gradle/gradle.properties

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build and test
        # Build and tests run in their own Gradle daemon so its heap is released
        # before the scan starts. Keeping them in one invocation made the scan
        # inherit the build's committed memory and pushed the container over its
        # 1.5 GiB limit during "Indexing files..." (exit 137).
        #
        # MEMORY BOUND: the runner pod limit is 2 GiB, sized to the ~2.6 GiB of
        # headroom on lenovo-worker. The previous 1.5 GiB pod forced a
        # 704m/192m JVM clamp, and :adapters:fabric:shadowJar exhausted
        # metaspace on the Minecraft/Fabric class load, failing the build with
        # "Metaspace". 1024m heap + 384m metaspace peaks near 1.3 GiB, leaving
        # room for the Gradle client and code cache inside 2 GiB.
        # build-and-test on ubuntu-latest keeps its 2 GiB heap.
        run: >-
          ./gradlew build jacocoTestReport --no-daemon
          -Dorg.gradle.jvmargs="-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8"
          --no-parallel --max-workers=2

      - name: Analyze
        # The org.sonarqube Gradle plugin runs the scan in-process. The scan job
        # runs on the same runner as the build, so the coverage report is on disk
        # when the scanner reads it. SONAR_TOKEN is picked up from the
        # environment; the host URL is passed as a system property because the
        # plugin does not map SONAR_HOST_URL to sonar.host.url.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./gradlew sonar --no-daemon
          -Dsonar.host.url="$SONAR_HOST_URL"
          -Dorg.gradle.jvmargs="-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8"
          --no-parallel --max-workers=2
          --info
