name: SonarQube

# Analysis runs on the self-hosted ARC runners in the homelab, because that is
# the only place that can reach the in-cluster SonarQube Service.
#
# Push to main only. This SonarQube is Community Build, which does not support
# pull-request analysis: passing sonar.pullrequest.* aborts the scan with
# "To use the property sonar.pullrequest.key and analyze pull requests,
# Developer Edition or above is required", so a PR trigger can only ever produce
# a red check here.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Selected by `runnerScaleSetName: minecraft-mcp-runners` in the homelab repo
    # (apps/arc-runners-minecraft-mcp/values.yaml).
    runs-on: minecraft-mcp-runners
    # ARC's Kubernetes container mode sets ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER=true,
    # so the job MUST declare a container. The actions-runner image brings git,
    # curl, sudo and apt; the step below adds gpg/dirmngr, and actions/setup-java
    # provides the JDK 21 toolchain the build and the Gradle Sonar plugin need.
    container:
      image: ghcr.io/actions/actions-runner:latest
    env:
      # In-cluster Service DNS. The sq.homelab.local name is LAN-only and signed
      # by the private homelab CA, so CI cannot resolve or trust it.
      SONAR_HOST_URL: http://sonarqube-sonarqube.sonarqube.svc.cluster.local:9000
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Full history gives the scanner accurate new-code and blame data.
          fetch-depth: 0

      - name: Ensure scanner prerequisites (gpg, dirmngr)
        # The actions-runner image ships no JRE and no gpg/dirmngr. The Gradle
        # Sonar plugin resolves and runs the scanner, and gpg/dirmngr are needed
        # if the plugin verifies downloaded artifacts. default-jre-headless is
        # OpenJDK 21 on Ubuntu 24.04; setup-java below provides the build JDK.
        run: |
          if ! command -v java >/dev/null 2>&1 \
             || ! command -v gpg >/dev/null 2>&1 \
             || ! command -v dirmngr >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends \
              gpg dirmngr default-jre-headless
          fi
          java -version

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build and analyze
        # The org.sonarqube Gradle plugin runs the scan in-process. `build`
        # compiles and runs the tests; `jacocoTestReport` turns the execution
        # data into the XML report named in sonar-project.properties. The scan
        # job runs on the same runner as the build, so the report is on disk
        # when the scanner reads it.
        #
        # SONAR_TOKEN is picked up from the environment by the scanner. The host
        # URL is passed as a system property because the Gradle plugin does not
        # map the SONAR_HOST_URL environment variable to sonar.host.url.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          ./gradlew build jacocoTestReport sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          --info
