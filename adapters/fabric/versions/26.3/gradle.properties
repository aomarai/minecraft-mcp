# One file per Minecraft node: everything that differs between versions of this loader's build.
minecraft_version=26.3
fabric_loader_version=0.20.1
fabric_api_version=0.165.0+26.3
java_version=25
minecraft_range=~26.3
# 26.1 and later are unobfuscated: Loom's non-remapping plugin, no mappings
remap=false
game_tests=false
compat=modern
# What the smoke test uses where Minecraft renamed things
smoke_gamerule=advance_time
smoke_time_query=minecraft:day
smoke_time_expect=is at 60
