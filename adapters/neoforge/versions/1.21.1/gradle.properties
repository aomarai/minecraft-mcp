# One file per Minecraft node: everything that differs between versions of this loader's build.
minecraft_version=1.21.1
neoforge_version=21.1.265
# Loader and Minecraft ranges written into neoforge.mods.toml
neoforge_range=[21.1,21.2)
minecraft_range=[1.21.1,1.21.2)
java_version=21
compat=legacy
# What the smoke test uses where Minecraft renamed things
smoke_gamerule=doDaylightCycle
smoke_time_query=daytime
smoke_time_expect=The time is 60
