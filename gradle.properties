# Measured on a full rebuild of core, stdio-shim, rcon and the Fabric 1.21.1 and 26.3 nodes (--rerun-tasks, one Gradle
# JVM): peak heap used 0.95 GB, peak metaspace used 0.2 GB (docs/ci.md). So 2 GB of heap is twice the need, and the
# metaspace cap is 2.5 times it: a build that outgrows it fails with a clear "Metaspace" error instead of eating the
# runner. The SonarQube job sets its own, tighter limits for its 2 GiB pod (.github/workflows/sonarqube.yml).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Dependency and plugin downloads from the public repositories fail now and then for reasons that clear up in a
# second: a connection reset from maven.fabricmc.net (the 26.3 client smoke job), or a 403 from Maven Central's rate
# limit (a CodeQL build). Gradle retries a failed download 3 times with a 125 ms start-up delay by default, which is
# too short to outlast either, so retry 6 times and back off from one second (1, 2, 4, ... seconds).
systemProp.org.gradle.internal.repository.max.retries=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
