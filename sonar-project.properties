# SonarQube analysis configuration.
#
# The project key and name are set in build.gradle.kts by the org.sonarqube
# plugin. The key is assigned by the GitHub App import and carries a generated
# suffix; read it from the server, not from a comment. This file carries the
# source/test/coverage configuration that the Gradle plugin and the standalone
# scanner both read.

# Only `core` contains Java source today. Adapter modules are placeholders; add
# their src/main/java directories here as they gain code. Sonar reads the
# compiled classes from the Gradle build output, so the scan job must build first.
sonar.sources=core/src/main/java
sonar.tests=core/src/test/java
sonar.java.binaries=core/build/classes/java/main
sonar.java.test.binaries=core/build/classes/java/test

sonar.sourceEncoding=UTF-8

# Gradle build output, wrapper, and generated files are not source.
sonar.exclusions=\
  **/build/**,\
  .gradle/**,\
  gradle/**

# Coverage is produced by JaCoCo in the same job that runs the scanner. The
# report path is fixed by the `jacocoTestReport` task in build.gradle.kts.
sonar.coverage.jacoco.xmlReportPaths=core/build/reports/jacoco/test/jacocoTestReport.xml
